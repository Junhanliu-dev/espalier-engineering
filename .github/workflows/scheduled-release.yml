# Scheduled release — merge + tag + GitHub-release a labeled PR at a fixed
# wall-clock time, on GitHub's runners, independent of any developer machine.
#
# Repeatable usage:
#   1. Open a PR into main titled "vX.Y.Z — <tagline>". Its branch must already
#      carry the CHANGELOG "## X.Y.Z" section and the version bumps.
#   2. Add the label `scheduled-release`.
#   3. At the next release slot the workflow: validates title + CHANGELOG,
#      merges with the repo's merge-commit subject pattern
#      ("Merge PR #N: vX.Y.Z — ..."), pushes annotated tag vX.Y.Z, and
#      publishes a GitHub release using the CHANGELOG section as notes.
#   No labeled PR → the daily run exits quietly.
#
# Timing: the cron fires 10:40 UTC daily (GitHub cron can lag several minutes,
# so it fires early on purpose); the job then sleeps until RELEASE_AT_UTC
# (11:00 UTC = 21:00 AEST). The schedule does not track DST — during AEDT
# (Oct–Apr) 11:00 UTC is 22:00 in Sydney; edit the cron AND RELEASE_AT_UTC
# together to shift the slot.
#
# Manual escape hatch: workflow_dispatch runs the same job immediately
# (no wait) — useful for "release now" and for testing.
#
# Caveats: GitHub suspends scheduled workflows after ~60 days of repo
# inactivity (re-enable from the Actions tab). Merge/tag/release author shows
# as github-actions[bot]; the commits inside stay yours.

name: scheduled-release

on:
  schedule:
    - cron: "40 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scheduled-release
  cancel-in-progress: false

env:
  RELEASE_AT_UTC: "11:00"
  RELEASE_LABEL: scheduled-release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Find the labeled PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --repo "$REPO" --base main --state open \
                  --label "$RELEASE_LABEL" --json number,title,headRefName)
          count=$(jq length <<< "$prs")
          if [ "$count" -eq 0 ]; then
            echo "No open PR labeled '$RELEASE_LABEL' — nothing to release today."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$count" -gt 1 ]; then
            echo "ERROR: $count PRs carry '$RELEASE_LABEL' — refusing to guess. Unlabel all but one." >&2
            exit 1
          fi
          number=$(jq -r '.[0].number' <<< "$prs")
          title=$(jq -r '.[0].title' <<< "$prs")
          head=$(jq -r '.[0].headRefName' <<< "$prs")
          version=$(grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+' <<< "$title" || true)
          if [ -z "$version" ]; then
            echo "ERROR: PR #$number title must start with 'vX.Y.Z — ' (got: $title)" >&2
            exit 1
          fi
          if git ls-remote --tags "https://github.com/$REPO" "refs/tags/$version" | grep -q .; then
            echo "ERROR: tag $version already exists — bump the PR title/CHANGELOG first." >&2
            exit 1
          fi
          {
            echo "found=true"
            echo "number=$number"
            echo "head=$head"
            echo "version=$version"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"
          echo "Will release PR #$number as $version: $title"

      - name: Checkout PR head
        if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG
        if: steps.pr.outputs.found == 'true'
        env:
          VERSION: ${{ steps.pr.outputs.version }}
        run: |
          set -euo pipefail
          plain="${VERSION#v}"
          # Section runs from "## <plain> ..." to the next "## " heading.
          awk -v ver="$plain" '
            $0 ~ "^## "ver" " || $0 ~ "^## "ver"$" {grab=1; next}
            grab && /^## / {exit}
            grab {print}
          ' CHANGELOG.md > /tmp/notes.md
          if ! grep -q '[^[:space:]]' /tmp/notes.md; then
            echo "ERROR: no '## $plain' section found in CHANGELOG.md — refusing to release without notes." >&2
            exit 1
          fi
          {
            echo ""
            echo "---"
            echo "Setup guide: [docs/codex-integration.md](https://github.com/${{ github.repository }}/blob/main/docs/codex-integration.md) · Existing installs: run \`/espalier-migrate\` (see \`docs/migrating-*\`)."
          } >> /tmp/notes.md
          echo "Notes extracted ($(wc -l < /tmp/notes.md) lines)."

      - name: Wait for the release slot
        if: steps.pr.outputs.found == 'true' && github.event_name == 'schedule'
        run: |
          set -euo pipefail
          target=$(date -u -d "today $RELEASE_AT_UTC" +%s)
          now=$(date -u +%s)
          if [ "$now" -lt "$target" ]; then
            echo "Sleeping $((target - now))s until $RELEASE_AT_UTC UTC."
            sleep $((target - now))
          else
            echo "Past $RELEASE_AT_UTC UTC already — proceeding now."
          fi

      - name: Merge PR (repo merge-commit subject pattern)
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          TITLE: ${{ steps.pr.outputs.title }}
        run: |
          set -euo pipefail
          gh pr merge "$NUMBER" --repo "$REPO" --merge \
            --subject "Merge PR #$NUMBER: $TITLE"

      - name: Tag the merge commit
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          VERSION: ${{ steps.pr.outputs.version }}
          TITLE: ${{ steps.pr.outputs.title }}
        run: |
          set -euo pipefail
          merge_sha=$(gh pr view "$NUMBER" --repo "$REPO" --json mergeCommit -q .mergeCommit.oid)
          [ -n "$merge_sha" ] || { echo "ERROR: merge commit SHA not found." >&2; exit 1; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git tag -a "$VERSION" -m "$TITLE" "$merge_sha"
          git push origin "$VERSION"
          echo "Tagged $merge_sha as $VERSION."

      - name: Publish GitHub release
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.pr.outputs.version }}
          TITLE: ${{ steps.pr.outputs.title }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" --repo "$REPO" \
            --title "$TITLE" \
            --notes-file /tmp/notes.md \
            --verify-tag
          echo "Released: https://github.com/$REPO/releases/tag/$VERSION"

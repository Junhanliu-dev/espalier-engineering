<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="How Espalier works: espalier-init reads your codebase and discovers its patterns, generates a per-project espalier directory of rules, skills, agents, wiki and hooks, and every later change runs through a gated pipeline where a coder agent writes and a separate reviewer agent enforces the same rules.">
  <defs>
    <marker id="fw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6fd39a"/>
    </marker>
  </defs>

  <rect width="1200" height="300" rx="18" fill="#0c1f16"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- card 1: your codebase -->
    <rect x="36" y="48" width="248" height="204" rx="14" fill="#16281f" stroke="#2e5c47"/>
    <text x="160" y="86" font-size="18" font-weight="700" fill="#ecf6ef" text-anchor="middle">1 &#183; Your codebase</text>
    <g stroke="#3c6b53" fill="#0f1d16">
      <rect x="76" y="106" width="120" height="30" rx="5"/>
      <rect x="92" y="122" width="120" height="30" rx="5"/>
      <rect x="108" y="138" width="120" height="30" rx="5"/>
    </g>
    <text x="160" y="200" font-size="12.5" fill="#8fae9d" text-anchor="middle">years of unwritten rules:</text>
    <text x="160" y="218" font-size="12.5" fill="#8fae9d" text-anchor="middle">helpers, layers, error style,</text>
    <text x="160" y="236" font-size="12.5" fill="#8fae9d" text-anchor="middle">who-calls-what</text>

    <line x1="290" y1="150" x2="330" y2="150" stroke="#6fd39a" stroke-width="2.5" marker-end="url(#fw)"/>
    <text x="310" y="136" font-size="11" fill="#9fd8b6" text-anchor="middle">reads</text>

    <!-- card 2: init discovers -->
    <rect x="336" y="48" width="248" height="204" rx="14" fill="#16281f" stroke="#2e5c47"/>
    <text x="460" y="86" font-size="18" font-weight="700" fill="#ecf6ef" text-anchor="middle">2 &#183; /espalier-init</text>
    <circle cx="440" cy="140" r="24" fill="none" stroke="#6fd39a" stroke-width="3"/>
    <line x1="458" y1="158" x2="482" y2="182" stroke="#6fd39a" stroke-width="5" stroke-linecap="round"/>
    <text x="460" y="216" font-size="12.5" fill="#8fae9d" text-anchor="middle">parallel scouts discover your</text>
    <text x="460" y="234" font-size="12.5" fill="#8fae9d" text-anchor="middle">patterns &#8212; once, ~10&#8211;15 min</text>

    <line x1="590" y1="150" x2="630" y2="150" stroke="#6fd39a" stroke-width="2.5" marker-end="url(#fw)"/>
    <text x="610" y="136" font-size="11" fill="#9fd8b6" text-anchor="middle">writes</text>

    <!-- card 3: espalier/ -->
    <rect x="636" y="48" width="248" height="204" rx="14" fill="#16281f" stroke="#2e5c47"/>
    <text x="760" y="86" font-size="18" font-weight="700" fill="#6fd39a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3 &#183; espalier/</text>
    <g font-size="12.5" fill="#cfe8da" text-anchor="middle">
      <rect x="662" y="104" width="94" height="28" rx="6" fill="#0f1d16" stroke="#3c6b53"/><text x="709" y="122">rules</text>
      <rect x="764" y="104" width="94" height="28" rx="6" fill="#0f1d16" stroke="#3c6b53"/><text x="811" y="122">skills</text>
      <rect x="662" y="140" width="94" height="28" rx="6" fill="#0f1d16" stroke="#3c6b53"/><text x="709" y="158">agents</text>
      <rect x="764" y="140" width="94" height="28" rx="6" fill="#0f1d16" stroke="#3c6b53"/><text x="811" y="158">wiki</text>
      <rect x="662" y="176" width="94" height="28" rx="6" fill="#0f1d16" stroke="#3c6b53"/><text x="709" y="194">hooks</text>
      <rect x="764" y="176" width="94" height="28" rx="6" fill="#0f1d16" stroke="#3c6b53"/><text x="811" y="194">changes</text>
    </g>
    <text x="760" y="234" font-size="12.5" fill="#8fae9d" text-anchor="middle">your conventions, machine-readable</text>

    <line x1="890" y1="150" x2="930" y2="150" stroke="#6fd39a" stroke-width="2.5" marker-end="url(#fw)"/>
    <text x="910" y="136" font-size="11" fill="#9fd8b6" text-anchor="middle">enforces</text>

    <!-- card 4: gated pipeline -->
    <rect x="936" y="48" width="228" height="204" rx="14" fill="#16351f" stroke="#3f7a56"/>
    <text x="1050" y="86" font-size="18" font-weight="700" fill="#ecf6ef" text-anchor="middle">4 &#183; Every change</text>
    <g font-size="13" fill="#cfe8da">
      <text x="962" y="120">coder agent writes</text>
      <text x="962" y="146">reviewer agent checks</text>
      <text x="962" y="172">hooks gate the push</text>
    </g>
    <g fill="#6fd39a" font-size="13">
      <text x="1146" y="120" text-anchor="end">&#10003;</text>
      <text x="1146" y="146" text-anchor="end">&#10003;</text>
      <text x="1146" y="172" text-anchor="end">&#10003;</text>
    </g>
    <text x="1050" y="216" font-size="12.5" fill="#9fd8b6" text-anchor="middle" font-weight="600">code that fits, first try</text>
    <text x="1050" y="234" font-size="12.5" fill="#8fae9d" text-anchor="middle">with a full audit trail</text>
  </g>
</svg>
